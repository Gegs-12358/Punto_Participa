services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ⚠️ Estos deben coincidir con DB_NAME / DB_USER / DB_PASSWORD de tu .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    #ports:
        # ports:
        #   - "127.0.0.1:5432:5432"
        #- "127.0.0.1:5432:5432"   # solo accesible desde este computador
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, el host de la BD es el nombre del servicio: "db"
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app                     # código en vivo (útil en desarrollo)
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"

volumes:
  pgdata:
  static_volume:
  media_volume:
