services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ⚠️ Estos deben coincidir con DB_NAME / DB_USER / DB_PASSWORD de tu .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    #ports:
        # ports:
        #   - "127.0.0.1:5432:5432"
        #- "127.0.0.1:5432:5432"   # solo accesible desde este computador
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, el host de la BD es el nombre del servicio: "db"
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app                     # código en vivo (útil en desarrollo)
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"

  # Respaldo automático (historia 008). Usa la misma imagen de PostgreSQL que la base,
  # así pg_dump es de la misma versión. Ver respaldo/LEEME.md
  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Los archivos quedan a nombre de tu usuario del computador (no de root)
    user: "${RESPALDO_UID:-1000}:${RESPALDO_GID:-1000}"
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      RESPALDO_CADA_HORAS: ${RESPALDO_CADA_HORAS:-24}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-30}
      TZ: America/Santiago
    volumes:
      - ./respaldo:/scripts:ro
      - media_volume:/media:ro
      - ${RESPALDO_DIR:-./respaldos}:/respaldos
    entrypoint: ["sh", "/scripts/programar.sh"]

volumes:
  pgdata:
  static_volume:
  media_volume:
