{% load static %}

<!-- ============================================================ -->
<!-- MODAL PARA CREAR/EDITAR ACTIVIDAD -->
<!-- ============================================================ -->
<div class="modal-backdrop" id="actividadModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalLabel">

        <header class="modal-header">
            <h2 id="modalLabel">Crear/Editar Actividad</h2>
            <button type="button"
                    class="close-button"
                    data-modal-close
                    aria-label="Cerrar">×</button>
        </header>

        <div id="modalBody" class="modal-body">
            <div class="empty-state">
                <span>◌</span>
                <p>Cargando formulario...</p>
            </div>
        </div>

    </section>
</div>

<!-- ============================================================ -->
<!-- MODAL DE CONFIRMACIÓN DE INVITACIONES -->
<!-- ============================================================ -->
<div class="modal-backdrop" id="modalConfirmarInvitaciones" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalConfirmarInvitacionesLabel">

        <header class="modal-header">
            <h2 id="modalConfirmarInvitacionesLabel">Enviar Invitaciones</h2>
            <button type="button"
                    class="close-button"
                    data-modal-close
                    aria-label="Cerrar">×</button>
        </header>

        <div class="modal-body">

            <div id="invitacion-message" class="alert alert-info">
                <div>
                    <strong>Actividad guardada correctamente.</strong>
                    <span id="invitacion-texto">¿Deseas enviar invitaciones por correo?</span>
                </div>
            </div>

            <div id="invitacion-info-destinatarios" class="d-none" style="margin-bottom: 15px;">
                <small class="text-muted">
                    ◎ Destinatarios estimados: <strong id="invitacion-total">0</strong>
                </small>
            </div>

            <div style="text-align: center; margin-bottom: 15px;">
                <button type="button"
                        class="btn secondary"
                        id="btnVerPrevisualizacion">
                    ◎ Ver cómo se verá el correo
                </button>
            </div>

            <div id="invitacion-preview-container" class="d-none">
                <h3 style="border-top: 1px solid var(--line); padding-top: 15px; margin-top: 15px; margin-bottom: 10px; font-size: 15px; color: var(--navy);">
                    ▣ Previsualización
                    <small class="text-muted" id="invitacion-ejemplo"></small>
                </h3>
                <div style="border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 400px; overflow-y: auto;">
                    <iframe id="invitacion-preview-iframe"
                            style="width: 100%; min-height: 400px; border: none;"
                            sandbox="allow-same-origin"
                            title="Previsualización del correo de invitación"></iframe>
                </div>
            </div>

            <div id="invitacion-resultado" aria-live="polite"></div>
        </div>

        <footer class="modal-footer">
            <button type="button"
                    class="btn danger d-none"
                    id="btnEliminarActividad">
                ✕ Eliminar actividad
            </button>
            <button type="button"
                    class="btn secondary"
                    id="btnCancelarEnvio">
                × Ahora no
            </button>
            <button type="button"
                    class="btn"
                    id="btnConfirmarEnvio">
                ➤ Enviar
            </button>
        </footer>

    </section>
</div>
