# Configuración de Docker de Punto Participa. Se ejecuta desde esta carpeta (maquinasVirtuales):
#   docker compose up -d --build
# El código de la aplicación está en ../src/punto_participa_project.
# El nombre fijo hace que Docker use los mismos volúmenes (pgdata, media_volume) que antes de mover
# esta configuración: sin él tomaría el nombre de la carpeta y crearía una base de datos vacía.
name: punto_participa_project

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ⚠️ Estos deben coincidir con DB_NAME / DB_USER / DB_PASSWORD de tu .env
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    #ports:
        # ports:
        #   - "127.0.0.1:5432:5432"
        #- "127.0.0.1:5432:5432"   # solo accesible desde este computador
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      # Contexto = raíz del repositorio, para tomar el código de src/ y entrypoint.sh de aquí.
      # Qué entra a la imagen: Dockerfile.dockerignore
      context: ..
      dockerfile: maquinasVirtuales/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, el host de la BD es el nombre del servicio: "db"
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src/punto_participa_project:/app   # código en vivo (útil en desarrollo)
      - .:/maquinasVirtuales:ro               # esta carpeta, para las pruebas que revisan la configuración
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"

  # Tareas programadas (retención de datos, ver gestion/retencion.py). Usa la misma imagen que web
  # y corre "python manage.py retencion" una vez al día (tareas/programar.sh).
  tareas:
    build:
      # Contexto = raíz del repositorio, para tomar el código de src/ y entrypoint.sh de aquí.
      # Qué entra a la imagen: Dockerfile.dockerignore
      context: ..
      dockerfile: maquinasVirtuales/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src/punto_participa_project:/app
      - ./tareas:/tareas:ro
      - media_volume:/app/media
    entrypoint: ["sh", "/tareas/programar.sh"]

  # Respaldo automático (historia 008). Usa la misma imagen de PostgreSQL que la base,
  # así pg_dump es de la misma versión. Ver respaldo/LEEME.md
  respaldo:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Los archivos quedan a nombre de tu usuario del computador (no de root)
    user: "${RESPALDO_UID:-1000}:${RESPALDO_GID:-1000}"
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      RESPALDO_CADA_HORAS: ${RESPALDO_CADA_HORAS:-24}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-30}
      TZ: America/Santiago
    volumes:
      - ./respaldo:/scripts:ro
      - media_volume:/media:ro
      - ${RESPALDO_DIR:-./respaldos}:/respaldos
    entrypoint: ["sh", "/scripts/programar.sh"]

volumes:
  pgdata:
  static_volume:
  media_volume:
