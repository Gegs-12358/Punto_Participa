{# Recuadro destacado para algo que el alumno no debe pasar por alto. Variables: titulo, texto. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff6db" style="background-color: #fff6db; border: 1px solid #f3d27a; border-left: 5px solid #FBB800; border-radius: 6px; border-collapse: separate; margin: 4px 0 18px;">
    <tr><td style="padding: 12px 16px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.5; color: #1f2d3d;">
        <strong style="color: #002F5F;">{{ titulo }}</strong><br>{{ texto }}
    </td></tr>
</table>
