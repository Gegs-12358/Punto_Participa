{% load ui %}{# Imagen de la actividad a todo el ancho. Si el programa de correo bloquea las imágenes, queda un recuadro azul con el título. #}
{% if actividad.imagen_correo %}
                    <tr>
                        <td bgcolor="#002F5F" style="background-color: #002F5F; padding: 0;">
                            <img src="{% url_absoluta actividad.imagen_correo.url %}" alt="{{ actividad.titulo }}" width="600" height="300"
                                style="display: block; width: 100%; max-width: 600px; height: auto; border: 0; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; line-height: 1.3; color: #ffffff; text-align: center;">
                        </td>
                    </tr>
{% elif actividad.imagen %}
                    <tr>
                        <td bgcolor="#002F5F" style="background-color: #002F5F; padding: 0;">
                            <img src="{% url_absoluta actividad.imagen.url %}" alt="{{ actividad.titulo }}" width="600"
                                style="display: block; width: 100%; max-width: 600px; height: auto; border: 0; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; line-height: 1.3; color: #ffffff; text-align: center;">
                        </td>
                    </tr>
{% endif %}
