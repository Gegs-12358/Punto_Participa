{% load ui %}{# Imagen de la actividad a todo el ancho (la propia o la genérica de su tipo). Si el programa de correo bloquea las imágenes, queda un recuadro azul con el título. #}
                    <tr>
                        <td bgcolor="#002F5F" style="background-color: #002F5F; padding: 0;">
                            <img src="{% url_absoluta actividad.url_imagen_correo site_url %}" alt="{{ actividad.titulo }}" width="600"{% if actividad.imagen_correo or not actividad.imagen %} height="300"{% endif %}
                                style="display: block; width: 100%; max-width: 600px; height: auto; border: 0; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: bold; line-height: 1.3; color: #ffffff; text-align: center;">
                        </td>
                    </tr>
