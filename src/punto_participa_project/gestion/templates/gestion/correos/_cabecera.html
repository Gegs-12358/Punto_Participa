{% load static ui %}{% static 'gestion/img/duoc.png' as logo_pp %}{% static 'gestion/img/logo_duoc.png' as logo_duoc %}
{# Cabecera común de los correos: logos y, si la actividad tiene imagen, la imagen a todo el ancho. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-bottom: 4px solid #FBB800;">
    <tr>
        <td style="padding: 14px 20px;" align="left">
            <img src="{% url_absoluta logo_pp %}" alt="Punto Participa" height="44" style="display: block; height: 44px; border: 0;">
        </td>
        <td style="padding: 14px 20px;" align="right">
            <img src="{% url_absoluta logo_duoc %}" alt="Duoc UC" height="30" style="display: block; height: 30px; border: 0;">
        </td>
    </tr>
</table>
{% if actividad.imagen %}
<img src="{% url_absoluta actividad.imagen.url %}" alt="{{ actividad.titulo }}" width="600"
    style="display: block; width: 100%; max-width: 600px; height: auto; border: 0;">
{% endif %}
