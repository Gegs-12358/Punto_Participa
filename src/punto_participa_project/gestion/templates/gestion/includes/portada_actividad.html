{% load static %}
{# Portada de las páginas públicas: la imagen de la actividad (o la genérica de su tipo) con el tipo y el título encima. #}
{# Uso: include con actividad y etiqueta ("TALLER", "INVITACIÓN"...). #}
<div class="event-portada event-portada--imagen{% if actividad.usa_imagen_generica %} event-portada--generica{% endif %}">
    <img class="event-portada__img" src="{{ actividad.url_imagen }}" alt="" loading="eager">
    <div class="event-portada__texto">
        <span class="event-portada__tipo">{{ etiqueta|default:actividad.get_tipo_display|upper }}</span>
        <h1>{{ actividad.titulo }}</h1>
    </div>
</div>
